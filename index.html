<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormhole Racers Prototype</title>
    <link rel="stylesheet" href="/css/ui-styles.css">
    <style>
        /* All CSS from the original file is preserved here */
        @import url('https://fonts.googleapis.com/css2?family=Jura:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #cce;
            font-family: 'Jura', sans-serif, monospace;
        }

        #game-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        h1,
        h2,
        h3 {
            color: #66aaff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(102, 170, 255, 0.5);
        }

        .menu-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            pointer-events: auto;
        }

        .menu-container.menu-reveal {
            display: block;
            animation: menuRevealAnim 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes menuRevealAnim {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .menu-button {
            background-color: rgba(34, 85, 136, 0.7);
            border: 1px solid #337ab7;
            color: #cce;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Jura', sans-serif;
            transition: background-color 0.2s, box-shadow 0.2s;
            display: block;
            width: 250px;
            text-align: center;
        }

        .menu-button:hover {
            background-color: #337ab7;
            box-shadow: 0 0 15px rgba(51, 122, 183, 0.8);
            color: #fff;
        }

        #intro-sequence {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
        }

        .intro-content {
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #loading-status {
            color: #99c;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div id="intro-sequence" style="display: none;">
            <div class="intro-content">
                <p id="loading-status">Initializing...</p>
            </div>
        </div>
        <div id="mainMenu" class="menu-container">
            <div id="menuOptions"></div>
        </div>
        <div id="testMenu" class="menu-container">
            <div id="testMenuOptions"></div>
        </div>
        <!-- Shipyard Panel will be dynamically added by its component -->
    </div>
    <div style="position:fixed; bottom:10px; right:10px; z-index:9999; pointer-events:auto; display:flex; gap:8px;">
      <button id="install-btn" class="menu-button" style="display:none;">Install App</button>
      <button id="referee-btn" class="menu-button" title="Referee docs and download">Referee Server</button>
    </div>

    <!-- Game Canvas -->
    <div id="game-canvas-container">
        <!-- The 3D scene will be rendered here -->
    </div>

    <!--
        The manual script loading for ammo.js has been removed.
        Physics engine initialization is now handled by the enable3d library,
        which is triggered by the scenes that require physics.
    -->
    <link rel="manifest" href="./manifest.json">
    <script>
        console.log("index.html script tag is executing (Standard Engine Mode)");
    </script>
    <script>
      // Register service worker for offline / install
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(() => {
            console.log('Service worker registered');
          }).catch((e) => console.warn('Service worker registration failed', e));
        });
      }

      // beforeinstallprompt handling for custom Install button
      let deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const btn = document.getElementById('install-btn');
        if (btn) {
          btn.style.display = 'block';
          btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            try {
              deferredInstallPrompt.prompt();
              const choice = await deferredInstallPrompt.userChoice;
              console.log('User choice', choice);
              deferredInstallPrompt = null;
            } catch (err) {
              console.warn('Install prompt failed', err);
            }
          });
        }
      });


    <script>
      // Referee server button handler: open on-site docs
      (function () {
        const refereeBtn = document.getElementById('referee-btn');
        if (refereeBtn) {
          refereeBtn.addEventListener('click', (ev) => {
            const url = '/docs/referee/index.html';
            window.open(url, '_blank', 'noopener');
          });
        }
      })();
    </script>

    <script type="module" src="./src/t13ne/main.js"></script>

</body>

</html>
