name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --silent

      - name: Build
        run: npm run build --silent

      - name: Package referee server
        run: |
          mkdir -p dist/server
          if [ -d server ]; then
            cd server
            zip -r "../dist/server/referee-server.zip" . -x "node_modules/*" "*.log" || true
            cd -
          else
            echo "No server folder found to package"
          fi

      - name: Copy docs for publishing
        run: |
          mkdir -p dist/docs
          if [ -d docs ]; then
            cp -r docs/* dist/docs/ || true
          else
            echo "No docs folder to copy"
          fi

      - name: Upload build artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
